[ncbi]
# NAME of your existing environment variable, never the secret itself.
api_key_env = "NCBI_API_KEY"
require_api_key = true
requests_per_second = 10
email = ""
tool = "corpus-builder"

[download]
formats = ["pdf", "xml"] # optionally add "html"
max_bytes = 268435456
requests_per_second = 3

[http]
timeout_seconds = 60
max_attempts = 5
backoff_seconds = 1

[run]
resume = true

[sources]
# PubMed is still the only discovery database. These locate/enrich full text.
europe_pmc = true
# Enable only after setting your contact email; no paid subscription is used.
unpaywall = false
unpaywall_email = ""

[resolvers]
requests_per_second = 1
